[project]
name = "kiro-mlflow-hook"
version = "0.1.0"
description = "Kiro CLI hook that pushes agent metrics to OpenTelemetry via MLflow tracing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow>=3.6.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kiro-mlflow-hook = "kiro_mlflow_hook.hook:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
