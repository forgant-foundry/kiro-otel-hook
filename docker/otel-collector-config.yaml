receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # otlphttp appends the signal-specific path (/v1/traces) to this base URL,
  # which matches the path MLflow's ingestion endpoint expects.
  otlphttp/mlflow:
    endpoint: http://mlflow:5000
    headers:
      x-mlflow-experiment-id: "0" # MLflow's built-in "Default" experiment
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/mlflow, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
